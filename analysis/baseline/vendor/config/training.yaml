# Training / walk-forward / gating configuration. No Optuna, no hyperparameter
# search: this is a fixed, conservative baseline (RULE 10).

random_seed: 42

xgboost_params:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_alpha: 0.1
  reg_lambda: 1.0
  gamma: 0.0
  objective: "binary:logistic"
  eval_metric: "logloss"
  tree_method: "hist"
  random_state: 42
  n_jobs: -1

walk_forward:
  mode: "expanding"     # expanding | rolling
  n_folds: 5
  train_min_bars: 3000
  validation_bars: 750
  test_bars: 750
  # Bars removed from the end of TRAIN/VALIDATION adjacent to the next split,
  # sized to be >= the largest max_holding_horizon_bars so a target's forward
  # window cannot cross a split boundary.
  embargo_bars: 100

# Phase 5+6: frozen single-split dataset construction (TRAIN->VALIDATION->TEST).
# Fractions derive RAW boundaries over eligible unique entry timestamps; PURGE
# is then DERIVED (= max_holding_horizon_bars of the entry timeframe) and
# EMBARGO (walk_forward.embargo_bars above) is added on top -- raw vs final
# boundaries and all removed-bar counts are reported in the dataset manifest.
# No shuffle anywhere; TEST is locked after generation.
dataset_split:
  train_frac: 0.70
  val_frac: 0.15       # TEST takes the remainder (0.15)
  # Research-rebuild repair R4. Where the fractions are measured.
  #   calendar_time  -> 70% of the elapsed SPAN (default after the repair)
  #   eligible_index -> 70% of the surviving ROWS (reproduces Phase 5+6)
  # With a time-clustered eligibility mask -- 14-63% of the calendar surviving
  # in disjoint islands in this project -- the two are not the same thing, and
  # the index basis produced a VALIDATION block in a price regime TRAIN never
  # visited (XAUUSD H4: 0.00 price-range overlap, validation ROC-AUC 0.375).
  boundary_basis: "calendar_time"

leakage_detection:
  # Absolute Pearson correlation between a feature (as-of entry) and the raw
  # future close return above this is flagged for manual review (not an
  # automatic hard fail by itself; feature/target/timeframe leakage checks are).
  suspicious_feature_target_corr: 0.98

permutation_test:
  n_permutations: 1000
  metric: "roc_auc"
  significance_level: 0.05   # observed must exceed this fraction of the null distribution (p < alpha)
  min_percentile: 95.0       # observed metric must be >= this percentile of the null distribution

calibration:
  methods: ["sigmoid", "isotonic"]     # both are fit on VALIDATION only, selected by validation Brier score
  n_bins_ece: 10

thresholds:
  # External trading system position-sizing thresholds (RULE 17). Training Lab evaluates these
  # against VALIDATION only; it never re-derives or optimizes them, and never
  # touches TEST when producing the bucket analysis used for selection.
  buckets:
    - {min_p: 0.85, multiplier: 1.5}
    - {min_p: 0.75, multiplier: 1.2}
    - {min_p: 0.60, multiplier: 1.0}
    - {min_p: 0.50, multiplier: 0.5}
    - {min_p: 0.0,  multiplier: 0.0}   # < 0.50 -> reject

backtest:
  spread_source: "data"        # use the recorded `spread` column at entry bar
  slippage_pips: 0.5
  commission_per_lot: 0.0
  risk_per_trade_pct: 1.0

gates:
  min_test_samples: 200
  min_folds_passing: 3
  max_ece: 0.10
  min_profit_factor: 1.0
  min_expectancy: 0.0
